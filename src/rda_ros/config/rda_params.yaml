# ========================
# 机器人核心参数
# ========================
robot_info:
  dynamics: "omni"               # 机器人动力学模型 [diff:差速驱动, acker:阿克曼, omni:全向]
  max_speed: [2.0, 1.0]         # 最大线速度 [m/s] 和角速度 [rad/s]
  max_acce: [1.0, 0.5]          # 最大线加速度 [m/s²] 和角加速度 [rad/s²]
  length: 0.5                   # 机器人长度 (用于碰撞检测)
  width: 0.3                    # 机器人宽度
  wheelbase: 0.4                # 轴距 (仅阿克曼模型需要)
  cone_type: "norm2"        # 碰撞锥类型 [Rpositive:多边形, norm2:圆形]

# ========================
# 传感器输入配置
# ========================
use_scan_obstacle: true         # true=激光雷达输入, false=代价地图障碍物输入
scan_topic: "/scan"             # 激光雷达 Topic (use_scan_obstacle=true时生效)
scan_eps: 0.3                   # DBSCAN聚类半径 (米)
scan_min_samples: 5            # 最小聚类点数
obstacle_topic: "/move_base/obstacles"  # 代价地图障碍物 Topic (use_scan_obstacle=false时生效)

# ========================
# 坐标系设置
# ========================
target_frame: "map"             # 全局坐标系 (必须与move_base的global_frame一致)
base_frame: "base_link"         # 机器人基坐标系
lidar_frame: "lidar_link"       # 激光雷达坐标系

# ========================
# MPC优化器参数
# ========================
receding: 10                    # 预测步长 (控制实时性，值越大计算越慢)
iter_num: 2                     # ADMM迭代次数
sample_time: 0.1                # 时间步长 (秒)
process_num: 4                  # 并行计算线程数
accelerated: true               # 启用加速计算
time_print: false               # 是否打印计算耗时

# ========================
# 避障约束参数
# ========================
max_obs_num: 20                 # 最大处理障碍物数量
max_edge_num: 5                 # 单个障碍物的最大边数 (多边形障碍物)
iter_threshold: 0.2             # 收敛阈值
slack_gain: 8.0                 # 碰撞约束松弛系数
max_sd: 1.0                     # 最大安全距离 (米)
min_sd: 0.1                     # 最小安全距离 (米)

# ========================
# 代价函数权重
# ========================
ws: 1.0                         # 状态误差权重
wu: 0.5                         # 控制量变化权重
ro1: 200.0                      # ADMM惩罚项权重1
ro2: 1.0                        # ADMM惩罚项权重2

# ========================
# 路径跟踪参数
# ========================
ref_speed: 1.0                  # 参考跟踪速度 (m/s)
goal_index_threshold: 1         # 目标点到达阈值 (米)
enable_reverse: false           # 是否允许倒车
curve_type: "dubins"            # 参考路径生成类型 [dubins, reeds, line]
step_size: 0.1                  # 路径点间隔 (米)
min_radius: 0.5                 # 最小转弯半径 (米)

# ========================
# 可视化参数
# ========================
marker_x: 0.05                  # 障碍物标记线宽 (米)
marker_lifetime: 0.1            # 标记存活时间 (秒)